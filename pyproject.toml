[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "njupt-autologin"
version = "0.1.0"
description = "CLI login for the NJUPT wired network portal"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
njupt-autologin = "njupt_autologin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
