[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "njupt-autologin"
version = "0.8.0"
description = "CLI and native desktop control panel for the NJUPT wired network portal"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
njupt-autologin = "njupt_autologin.cli:main"
njupt-autologin-gui = "njupt_autologin.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
njupt_autologin = ["app-icon.svg", "app-icon.png"]
