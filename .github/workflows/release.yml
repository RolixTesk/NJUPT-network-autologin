name: Build release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  windows:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          }
      - name: Build native Windows packages
        run: python packaging/windows/build_windows.py --architecture ${{ matrix.architecture }}
      - name: Require portable and installer outputs
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "dist/*-${{ matrix.architecture }}-portable.zip")) { throw "portable archive missing" }
          if (-not (Get-ChildItem "dist/*-${{ matrix.architecture }}-setup.exe")) { throw "installer missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: dist/*-${{ matrix.architecture }}-*
          if-no-files-found: error

  debian:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build architecture-independent Debian package
        run: python packaging/debian/build_deb.py
      - uses: actions/upload-artifact@v4
        with:
          name: debian-all
          path: dist/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, debian]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --verify-tag
          fi
